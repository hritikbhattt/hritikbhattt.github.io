<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hritik Bhatt | Freelance Web Developer</title>
    <style>
        /* Premium Minimalist Palette */
        :root {
            --bg-white: #FFFFFF;
            --bg-beige: #F5F2E9;
            --accent-green: #1A4D2E;
            --green-hover: #133821;
            --text-dark: #1C1C1C;
            --text-gray: #595959;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-white);
            color: var(--text-dark);
            font-family: var(--font-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        nav {
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 15px;
            margin-left: 30px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-green);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 50px;
        }

        /* Hero Section */
        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        /* Status Badge */
        .badge {
            background-color: var(--bg-beige);
            color: var(--accent-green);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            display: inline-block;
        }

        .hero h1 {
            font-size: clamp(48px, 6vw, 85px);
            margin: 0 0 20px 0;
            color: var(--text-dark);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: var(--accent-green);
        }

        .hero p {
            color: var(--text-gray);
            max-width: 600px;
            font-size: 20px;
            margin: 0 0 40px 0;
            line-height: 1.5;
        }

        /* Call to Action Button */
        .btn {
            background-color: var(--accent-green);
            color: var(--bg-white);
            padding: 18px 36px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--green-hover);
        }

        /* Projects Section Placeholder - Uses Beige to separate from Hero */
        .projects {
            background-color: var(--bg-beige);
            padding: 100px 50px;
            margin-top: 50px;
        }

        .projects-inner {
            max-width: 1000px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Hritik Bhatt.</div>
        <div class="nav-links">
            <a href="#projects">Work</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <div class="badge">Available for freelance</div>
            <h1>Crafting fast, <br><span>custom web</span> experiences.</h1>
            <p>
                I help businesses move beyond clunky page builders. I engineer clean, hand-coded HTML/CSS/JS websites that prioritize speed, scalability, and seamless user design.
            </p>
            <a href="#projects" class="btn">View Case Studies</a>
        </section>
    </div>

    <section id="projects" class="projects">
        <div class="projects-inner">
            </div>
    </section>

</body>
</html>
